services:
  - type: web
    name: markettalento-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markettalento-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8002
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/v1/health
    startCommand: >
      sh -c "python scripts/init_db.py && uvicorn main:app --host 0.0.0.0 --port 8002"

  - type: web
    name: markettalento-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: API_URL
        value: http://markettalento-api:8002
    startCommand: >
      streamlit run app/main.py --server.port=8501 --server.address=0.0.0.0

  - type: web
    name: markettalento-web
    runtime: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./docs
    # Opcional: redirigir a dashboard
    routes:
      - type: rewrite
        source: /
        destination: /

databases:
  - name: markettalento-db
    plan: free
    databaseName: markettalento
    user: markettalento

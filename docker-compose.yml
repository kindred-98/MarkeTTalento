version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: markettalento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: markettalento
      POSTGRES_PASSWORD: markettalento_pass
      POSTGRES_DB: markettalento
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markettalento -d markettalento"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: markettalento_api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://markettalento:markettalento_pass@postgres:5432/markettalento
      - API_HOST=0.0.0.0
      - API_PORT=8002
      - SECRET_KEY=${SECRET_KEY:-markettalento-production-secret-key}
      - LOG_LEVEL=INFO
    volumes:
      - ./docs/img_productos:/app/docs/img_productos
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: >
      sh -c "python scripts/init_db.py && uvicorn main:app --host 0.0.0.0 --port 8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/api/v1/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  streamlit:
    build: .
    container_name: markettalento_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8002
    depends_on:
      api:
        condition: service_healthy
    command: >
      streamlit run app/main.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - ./docs/img_productos:/app/docs/img_productos

volumes:
  postgres_data:

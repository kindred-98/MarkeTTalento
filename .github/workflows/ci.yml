name: CI/CD - MarkeTTalento

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary :all: --upgrade pip==26.1
          pip install --only-binary :all: -r requirements.txt

      - name: Crear estructura de directorios
        run: |
          mkdir -p data logs backups

      - name: Inicializar base de datos para tests
        run: python scripts/init_db.py

      - name: Ejecutar tests
        run: pytest tests -v --tb=short

      - name: Generar reporte de cobertura
        run: |
          pip install --only-binary :all: pytest-cov==6.1.1
          pytest tests --cov=src --cov=app --cov-report=xml

      - name: Subir cobertura a Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        run: docker build -t markettalento:latest .

      - name: Verificar imagen
        run: docker images | grep markettalento

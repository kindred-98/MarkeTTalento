name: CI/CD - MarkeTTalento

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 queda fuera mientras requirements.txt fije pandas==2.2.3 y
        # pillow==11.1.0: no publican ruedas cp314, y con --only-binary :all:
        # pip no podria instalarlas. Paraeadir 3.14 hay que subir pandas a 3.x
        # y pillow a 12.x, y adaptar el codigo a sus cambios de API.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Las actions van fijadas por SHA completo (no por tag), para que un tag
      # movido no pueda cambiar lo que se ejecuta. El comentario indica la
      # version; para actualizar hay que cambiar el SHA.
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary :all: --upgrade pip==26.1
          pip install --only-binary :all: -r requirements.txt

      - name: Crear estructura de directorios
        run: |
          mkdir -p data logs backups

      - name: Inicializar base de datos para tests
        run: python scripts/init_db.py

      - name: Ejecutar tests
        run: pytest tests -v --tb=short

      - name: Generar reporte de cobertura
        run: |
          pip install --only-binary :all: pytest-cov==6.1.1
          pytest tests --cov=src --cov=app --cov-report=xml

      - name: Subir cobertura a Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build imagen Docker
        run: docker build -t markettalento:latest .

      - name: Verificar imagen
        run: docker images | grep markettalento
